# Ball Detection Manager Configuration
input_frame_topic: "robot/camera/frame"
output_position_topic: "robot/ball/position"
strategy: "hsv"
display_debug_window: false
debug_window_name: "Ball Detection Debug"

# Parameters for HSV color thresholding strategy
hsv:
  hue_min: 140.0
  hue_max: 180.0
  sat_min: 50.0
  sat_max: 255.0
  val_min: 50.0
  val_max: 255.0
  closure_kernel_size: 5
  path_length: 20

